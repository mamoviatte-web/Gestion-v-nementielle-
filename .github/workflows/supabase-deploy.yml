name: Supabase — appliquer les migrations

# Liaison GitHub → Supabase : à chaque push touchant supabase/migrations/**,
# le workflow relie le projet et applique les migrations manquantes (supabase db push).
# Les migrations sont idempotentes ; seules les nouvelles (non encore enregistrées
# dans supabase_migrations.schema_migrations) sont exécutées.

on:
  push:
    branches:
      - main
      - claude/new-session-vly2x6
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: xaudmdnffyumqqdvzpqd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier les secrets requis
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secrets manquants. Ajoute SUPABASE_ACCESS_TOKEN et SUPABASE_DB_PASSWORD"
            echo "::error::dans GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Relier le projet Supabase
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Appliquer les migrations (db push)
        run: supabase db push

      - name: Récapitulatif
        run: echo "✅ Migrations appliquées sur le projet $PROJECT_REF."
