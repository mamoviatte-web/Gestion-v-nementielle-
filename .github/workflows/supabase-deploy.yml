name: Supabase — appliquer les migrations

# Liaison GitHub → Supabase : à chaque push touchant supabase/migrations/**,
# le workflow relie le projet et applique les migrations manquantes (supabase db push).
# Les migrations sont idempotentes ; seules les nouvelles (non encore enregistrées
# dans supabase_migrations.schema_migrations) sont exécutées.

on:
  push:
    branches:
      - main
      - claude/new-session-vly2x6
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: xaudmdnffyumqqdvzpqd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Les migrations sont appliquées à chaque push via l'API de gestion Supabase
      # (hors-CI). Ce workflow est un filet redondant : s'il dispose des secrets, il
      # rejoue `db push` ; sinon il s'arrête proprement (jamais d'échec bloquant).
      - name: Détecter la présence des secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets Supabase absents (SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD)."
            echo "::warning::db push ignoré — les migrations restent appliquées via l'API de gestion."
            echo "::warning::Ajoute les 2 secrets dans Settings → Secrets and variables → Actions pour activer le déploiement CI."
          fi

      - name: Installer la CLI Supabase
        if: steps.secrets.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Relier le projet Supabase
        if: steps.secrets.outputs.present == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Appliquer les migrations (db push)
        if: steps.secrets.outputs.present == 'true'
        run: supabase db push

      - name: Récapitulatif
        run: |
          if [ "${{ steps.secrets.outputs.present }}" = "true" ]; then
            echo "✅ Migrations appliquées via CI sur le projet $PROJECT_REF."
          else
            echo "ℹ️ Secrets absents : db push ignoré. Migrations déjà appliquées hors-CI (API de gestion)."
          fi
